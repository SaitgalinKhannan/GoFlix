server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS; tell backend-facing code we're behind HTTPS.
    # nginx doesn't set these automatically from the tunnel, so propagate them.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Proxy API + SSE to the torrent-service container.
    location /api/ {
        proxy_pass http://torrent-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: disable buffering, allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Next.js static export with trailingSlash — SPA fallback.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
